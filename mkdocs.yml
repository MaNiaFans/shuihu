site_name: 水浒传逐回细读与人物研究
site_url: https://maniafans.github.io/shuihu/
site_description: 逐回细读、独立检校、修订与跨回追踪资料
site_author: MaNiaFans
repo_url: https://github.com/MaNiaFans/shuihu
repo_name: MaNiaFans/shuihu
edit_uri: blob/main/

docs_dir: .
site_dir: site

theme:
  name: material
  language: zh
  logo: material/book-open-page-variant
  font: false
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: brown
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

exclude_docs: |
  /site/
  /requirements.txt

not_in_nav: |
  skill_review/original/
  章节/第001回/AGENTS.md

nav:
  - 首页: index.md
  - 项目说明: README.md
  - 全书追踪:
      - 研究进度: 全书追踪/进度.md
      - 任务范围: 全书追踪/任务范围.md
      - 人物称谓与身份: 全书追踪/人物称谓与身份.md
      - 待解问题与修订记录: 全书追踪/待解问题与修订记录.md
  - 逐回细读:
      - 第001回试读说明: 章节/第001回/06_试读说明.md
      - 来源与范围: 章节/第001回/00_来源与范围.md
      - 初读: 章节/第001回/01_初读.md
      - 独立观察: 章节/第001回/02_独立观察.md
      - 检校意见: 章节/第001回/03_检校意见.md
      - 修订定稿: 章节/第001回/04_修订定稿.md
      - 追踪与交接: 章节/第001回/05_追踪与交接.md
  - 阅读规则:
      - 阅读 Skill: 阅读规则/shuihu-close-reading/SKILL.md
      - 逐回执行合同: 阅读规则/shuihu-close-reading/references/逐回执行合同.md
      - 派工与恢复: 阅读规则/shuihu-close-reading/references/派工与恢复.md
      - 执行与验收模板: 阅读规则/shuihu-close-reading/assets/07_执行与验收模板.md
      - 章回 AGENTS 模板: 阅读规则/shuihu-close-reading/assets/章回AGENTS模板.md
  - 工作流设计: 水浒人物深度解析_工作流设计.md
  - Skill 评审:
      - 评审结论: skill_review/评审结论.md
      - 强约束 2.0 验证: skill_review/强约束_2.0_验证.md
  - 项目执行约束: AGENTS.md
